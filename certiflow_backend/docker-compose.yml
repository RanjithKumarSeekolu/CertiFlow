services:
  postgres:
    image: postgres:16-alpine
    container_name: certiflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: certiflow
    ports:
      - "5432:5432"
    volumes:
      - certiflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certiflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certiflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - certiflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certiflow_backend
    restart: always
    environment:
      PORT: 8081
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/certiflow?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/certiflow?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "certiflow_production_secret_2026"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  certiflow_pgdata:
  certiflow_redisdata:

